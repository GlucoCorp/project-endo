# Service images (spec 12.4, ADR-0016). Actions pinned to full commit SHAs; version in comment.
#
# Pull requests: build each image, fail on HIGH/CRITICAL vulnerabilities, keep the CycloneDX SBOM.
# main only:     build, scan, push to private GHCR, SBOM the pushed digest, sign it, attach the SBOM
#                as a signed attestation with Sigstore keyless signing (GitHub OIDC, no stored key),
#                then verify both against this exact workflow identity.
#
# Keyless signing writes this repo's name, workflow path, branch and commit IDs to Sigstore's
# PUBLIC transparency log. Accepted by the product owner on 2026-11-08 (ADR-0016). No code, data
# or image contents are published; images stay private.
#
# Cost: each event builds each image once (PRs build, main publishes); ~2–3 billed minutes per image.
name: images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The only identity allowed to sign release images.
  SIGNER: https://github.com/GlucoCorp/project-endo/.github/workflows/images.yml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    name: build and scan (${{ matrix.service }})
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, bff-patient, identity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t endo-${{ matrix.service }}:ci .
      - name: Smoke test (read-only filesystem, all capabilities dropped, non-root)
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          eval "$(node tools/dev-keys.mjs)"   # throwaway keys for this test only
          common=(--read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18000:8080 -e ENDO_ENV=dev)
          if [ "$SERVICE" = api ]; then
            docker run -d --name smoke "${common[@]}" -e API_PORT=8080 -e API_HOST=0.0.0.0 \
              -e ENDO_CLINICAL_RULESET_PATH=/app/clinical/rulesets/ruleset.1.0.0.json \
              -e API_SERVICE_TOKEN_PUBLIC_KEY_JWK endo-api:ci
          elif [ "$SERVICE" = identity ]; then
            docker run -d --name smoke "${common[@]}" -e IDENTITY_PORT=8080 -e IDENTITY_HOST=0.0.0.0 \
              -e IDENTITY_IDP_ISSUER=http://localhost:18080/realms/endo-dev endo-identity:ci
          else
            docker run -d --name smoke "${common[@]}" -e BFF_PATIENT_PORT=8080 -e BFF_PATIENT_HOST=0.0.0.0 \
              -e BFF_PATIENT_DEV_SESSIONS_ENABLED=true -e BFF_PATIENT_API_BASE_URL=http://127.0.0.1:9 \
              -e BFF_PATIENT_SERVICE_TOKEN_PRIVATE_KEY_JWK endo-bff-patient:ci
          fi
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:18000/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:18000/healthz | grep -q '"ok"'
          test "$(docker inspect smoke --format '{{.Config.User}}')" = "65532:65532"
          docker rm -f smoke > /dev/null
      - name: Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: endo-${{ matrix.service }}:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: endo-${{ matrix.service }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 14

  publish:
    name: publish, sign and verify (${{ matrix.service }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write # push to GHCR with the job's short-lived GITHUB_TOKEN
      id-token: write # Sigstore keyless signing via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        service: [api, bff-patient, identity]
    env:
      IMAGE: ghcr.io/glucocorp/endo-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The installer's own bootstrap version: verified against a digest pinned in the action,
          # so no further release download is needed (v3.1.4 assets were unreachable, 2026-11-08).
          cosign-release: v3.0.6

      - name: Build
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t "$IMAGE:sha-$GITHUB_SHA" .
      - name: Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Push to private GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$GITHUB_SHA" | tee push.log
          digest="$(grep -oE 'digest: sha256:[0-9a-f]{64}' push.log | tail -1 | cut -d' ' -f2)"
          test -n "$digest"
          echo "REF=$IMAGE@$digest" >> "$GITHUB_ENV"
          echo "Pushed \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM of the pushed digest (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REF }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json

      - name: Sign image and attest SBOM (Sigstore keyless)
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.service }}.cdx.json" "$REF"

      - name: Verify signature and SBOM attestation against this workflow identity
        run: |
          cosign verify --certificate-identity "$SIGNER" --certificate-oidc-issuer "$OIDC_ISSUER" "$REF" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$OIDC_ISSUER" "$REF" > /dev/null
          echo "Verified signature and CycloneDX attestation for \`$REF\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 90
