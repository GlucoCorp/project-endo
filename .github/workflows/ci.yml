# Required CI checks (spec 18.2). Actions pinned to full commit SHAs (spec 12.4); version in comment.
# No secrets are used. Cloud access, when added, uses OIDC federation only.
#
# Cost: the org is on GitHub Free (2,000 private-repo Actions minutes/month, each job billed rounded
# up to a whole minute). Security scanners therefore share ONE job; every scanner still runs even
# if an earlier one fails, and the job fails if any of them found something.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Weekly re-scan of main: catches advisories published after code was merged.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, lint, tests, coverage, licences
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Throwaway Postgres for integration tests. SYNTHETIC data only; credentials are local to this
    # job's container and not secrets. Same digest-pinned image as infra/dev.
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: endo_test
          POSTGRES_PASSWORD: endo_test
          POSTGRES_DB: endo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U endo_test" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      ENDO_TEST_DATABASE_URL: postgres://endo_test:endo_test@localhost:5432/endo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm check:licences
      - run: pnpm check:readmes
      - run: pnpm check:inventory
      - run: pnpm check:realm
      - name: Browser tests (Playwright, headless Chromium; ADR-0020)
        run: |
          pnpm --filter @endo/bff-clinic exec playwright install --only-shell chromium
          pnpm --filter @endo/bff-clinic test:e2e
          pnpm --filter @endo/patient-web test:e2e
      # One database per store, as deployed (spec 5.2): stores never share tables or migration history.
      - name: Create one database per store
        run: |
          for db in audit_ci clinical_ci identity_ci; do
            psql postgres://endo_test:endo_test@localhost:5432/endo_test -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE $db"
          done
      - name: Audit migrations apply cleanly and are idempotent
        env:
          ENDO_AUDIT_MIGRATION_DATABASE_URL: postgres://endo_test:endo_test@localhost:5432/audit_ci
        run: |
          pnpm --filter @endo/audit migrate
          pnpm --filter @endo/audit migrate
      - name: Clinical migrations apply cleanly and are idempotent
        env:
          ENDO_CLINICAL_MIGRATION_DATABASE_URL: postgres://endo_test:endo_test@localhost:5432/clinical_ci
        run: |
          psql "$ENDO_CLINICAL_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f packages/clinical-store/bootstrap/roles.sql
          pnpm --filter @endo/clinical-store migrate
          pnpm --filter @endo/clinical-store migrate
      - name: Identity migrations apply cleanly and are idempotent
        env:
          ENDO_IDENTITY_MIGRATION_DATABASE_URL: postgres://endo_test:endo_test@localhost:5432/identity_ci
        run: |
          psql "$ENDO_IDENTITY_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f packages/identity-store/bootstrap/roles.sql
          pnpm --filter @endo/identity-store migrate
          pnpm --filter @endo/identity-store migrate
      - name: Postgres role scripts are idempotent and least-privilege (synthetic passwords)
        run: node tools/check-postgres-roles.mjs postgres://endo_test:endo_test@localhost:5432/endo_test
      - name: Unfinished clinical, licence and legal content (report)
        run: pnpm check:clinical

  security:
    name: security scans (gitleaks, Semgrep, OSV-Scanner, Trivy) + SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history
          persist-credentials: false

      - name: Secrets (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --exit-code 1 .

      - name: Static analysis (Semgrep)
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
          semgrep scan --metrics=off
          --config p/typescript --config p/nodejs --config p/jwt --config p/secrets
          --sarif-output=semgrep.sarif
      - name: Semgrep findings (annotations + summary)
        if: ${{ !cancelled() }}
        run: node tools/sarif-report.mjs Semgrep semgrep.sarif

      - name: Dependency vulnerabilities (OSV-Scanner)
        if: ${{ !cancelled() }}
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

      - name: Filesystem, IaC and secrets (Trivy)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: SBOM (CycloneDX)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
