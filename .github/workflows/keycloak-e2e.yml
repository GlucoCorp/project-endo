# ADR-0021 slice 8: enrolment and sign-in against the real Keycloak (pinned release plus our
# extension), with the real identity service, API and patient BFF. SYNTHETIC data only; no
# secrets (every key and password is generated per run). Actions pinned to full commit SHAs.
#
# Cost (GitHub Free): runs only when the parts it exercises change, weekly, and on demand.
name: keycloak-e2e

on:
  pull_request:
    paths:
      - services/keycloak-extension/**
      - infra/modules/platform/realm/**
      - services/identity/**
      - services/bff-patient/**
      - services/api/src/routes/enrolments.ts
      - services/api/src/routes/coordinator.ts
      - apps/patient-web/src/enrol/**
      - apps/patient-web/e2e-keycloak/**
      - .github/workflows/keycloak-e2e.yml
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: real Keycloak enrolment and sign-in (slice 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: endo_test
          POSTGRES_PASSWORD: endo_test
          POSTGRES_DB: endo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U endo_test" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      ENDO_TEST_DATABASE_URL: postgres://endo_test:endo_test@localhost:5432/endo_test
      ENDO_KEYCLOAK_IMAGE: endo-keycloak:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Keycloak image with the extension
        run: docker build -t endo-keycloak:ci services/keycloak-extension
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @endo/patient-web exec playwright install --only-shell chromium
      - run: pnpm --filter @endo/patient-web test:e2e:keycloak
