# CodeQL (spec 12.4, 18.2). Actions pinned to full commit SHAs.
#
# GitHub Code Security is not enabled on this private repository, so results cannot be uploaded
# to code scanning. Until it is, the analysis runs with `upload: never` and this job FAILS on any
# finding, so the check stays blocking. Once Code Security is enabled, set `upload: always` and
# keep the gate step.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # codeql-action reads its own workflow run on private repositories
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: never
          output: codeql-results
      - name: Fail on any CodeQL finding
        run: |
          count=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif
          echo "CodeQL findings: $count"
          test "$count" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
